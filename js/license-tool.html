<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ابزار ساخت کد فعال‌سازی</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #15161F; color: #fff; padding: 40px; display: flex; flex-direction: column; align-items: center; }
        .box { background: #1F2130; padding: 30px; border-radius: 16px; width: 100%; max-width: 500px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h1 { text-align: center; color: #14B8A6; margin-bottom: 20px; }
        input, select, button { width: 100%; padding: 12px; margin-top: 10px; border-radius: 8px; border: 1px solid #333; background: #2a2c3f; color: #fff; font-family: inherit; box-sizing: border-box; }
        button { background: linear-gradient(135deg, #14B8A6, #0D9488); color: #fff; font-weight: bold; cursor: pointer; border: none; margin-top: 20px; }
        button:hover { opacity: 0.9; }
        .result-box { margin-top: 20px; display: none; }
        .result { padding: 15px; background: #0f172a; border-radius: 8px; word-break: break-all; font-size: 14px; border: 1px solid #14B8A6; direction: ltr; text-align: center; margin-bottom: 10px; }
        .copy-btn { background: #3B82F6; margin-top: 0; }
    </style>
</head>
<body>
    <div class="box">
        <h1>🔑 ابزار ساخت کد</h1>
        
        <label>شناسه دستگاه (Device ID):</label>
        <input type="text" id="deviceId" placeholder="مثلاً: DEV-ABCD-1234" style="direction: ltr; text-align: center;">

        <label>مدت زمان اعتبار:</label>
        <select id="duration">
            <option value="Y1">۱ سال</option>
            <option value="Y2">۲ سال</option>
            <option value="M6">۶ ماه</option>
            <option value="M3">۳ ماه</option>
            <option value="D30">۳۰ روز</option>
            <option value="D10">۱۰ روز (تست)</option>
        </select>

        <button onclick="generateCode()">ساخت کد فعال‌سازی</button>
        
        <div id="resultBox" class="result-box">
            <div id="result" class="result"></div>
            <button class="copy-btn" onclick="copyCode()">📋 کپی کد</button>
        </div>
    </div>

        async function generateCode() {
            const deviceId = document.getElementById('deviceId').value.trim();
            const suffix = document.getElementById('duration').value;
            const resultBox = document.getElementById('resultBox');
            const resultDiv = document.getElementById('result');

            if (!deviceId) {
                alert('لطفاً شناسه دستگاه را وارد کنید');
                return;
            }
            
            const pemHeader = "-----BEGIN PRIVATE KEY-----";
            const pemFooter = "-----END PRIVATE KEY-----";
            const pemContents = PRIVATE_KEY_PEM.replace(pemHeader, '').replace(pemFooter, '').replace(/\s/g, '');
            const binaryDerString = window.atob(pemContents);
            const binaryDer = new Uint8Array(binaryDerString.length);
            for (let i = 0; i < binaryDerString.length; i++) {
                binaryDer[i] = binaryDerString.charCodeAt(i);
            }

            try {
                const privateKey = await crypto.subtle.importKey(
                    "pkcs8",
                    binaryDer,
                    { name: "RSASSA-PKCS1-v1_5", hash: "SHA-256" },
                    false,
                    ["sign"]
                );

                const dataToSign = new TextEncoder().encode(deviceId + suffix);
                const signature = await crypto.subtle.sign(
                    "RSASSA-PKCS1-v1_5",
                    privateKey,
                    dataToSign
                );

                const signatureBase64 = btoa(String.fromCharCode(...new Uint8Array(signature)));
                const finalCode = `CHK-${suffix}-${signatureBase64}`;
                
                resultBox.style.display = 'block';
                resultDiv.textContent = finalCode;
            } catch (e) {
                console.error(e);
                alert('خطا در ساخت کد! آیا کلید خصوصی را درست وارد کرده‌اید؟');
            }
        }

        function copyCode() {
            const code = document.getElementById('result').textContent;
            navigator.clipboard.writeText(code).then(() => {
                alert('✅ کد با موفقیت کپی شد!');
            }).catch(err => {
                alert('❌ خطا در کپی کردن!');
            });
        }
    </script>
</body>
</html>
