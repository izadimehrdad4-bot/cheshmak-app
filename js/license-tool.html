<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>ابزار تولید کد فعال‌سازی - چشمک</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Tahoma, sans-serif;
      background: linear-gradient(135deg, #15161F 0%, #1F2130 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: #1F2130;
      border: 2px solid #14B8A6;
      border-radius: 16px;
      padding: 30px;
      max-width: 500px;
      width: 100%;
    }
    h1 {
      color: #14B8A6;
      font-size: 22px;
      margin-bottom: 8px;
      text-align: center;
    }
    p.subtitle {
      color: #999;
      font-size: 13px;
      text-align: center;
      margin-bottom: 24px;
    }
    label {
      display: block;
      font-size: 13px;
      margin-bottom: 8px;
      color: #ccc;
    }
    input, select {
      width: 100%;
      padding: 12px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px;
      color: #fff;
      font-family: inherit;
      font-size: 14px;
      margin-bottom: 16px;
      text-align: center;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #14B8A6;
    }
    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #14B8A6, #0D9488);
      border: none;
      border-radius: 12px;
      color: #fff;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 16px;
    }
    button:hover { opacity: 0.9; }
    .result {
      background: rgba(20,184,166,0.1);
      border: 2px solid #14B8A6;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      display: none;
    }
    .result.show { display: block; }
    .code {
      font-size: 24px;
      font-weight: 800;
      color: #14B8A6;
      direction: ltr;
      letter-spacing: 2px;
      margin: 10px 0;
      padding: 12px;
      background: rgba(0,0,0,0.3);
      border-radius: 8px;
      user-select: all;
    }
    .copy-btn {
      background: rgba(20,184,166,0.2);
      border: 1px solid #14B8A6;
      color: #14B8A6;
      padding: 8px 16px;
      font-size: 12px;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔑 ابزار تولید کد فعال‌سازی</h1>
    <p class="subtitle">چشمک - نسخه‌ی مدیریت</p>
    
    <label>Device ID کاربر:</label>
    <input type="text" id="device-id" placeholder="DEV-XXXX-XXXX" style="direction: ltr; text-align: center;">
    
    <label>مدت لایسنس:</label>
    <select id="years">
      <option value="1">۱ ساله</option>
      <option value="2">۲ ساله</option>
      <option value="3">۳ ساله</option>
      <option value="5">۵ ساله</option>
      <option value="10">۱۰ ساله (تقریباً دائمی)</option>
    </select>
    
    <button onclick="generateCode()">🔑 تولید کد فعال‌سازی</button>
    
    <div class="result" id="result">
      <div style="font-size:12px;color:#999;margin-bottom:8px">کد فعال‌سازی:</div>
      <div class="code" id="code-output">—</div>
      <button class="copy-btn" onclick="copyCode()">📋 کپی کد</button>
    </div>
  </div>
  
  <script>
    const LICENSE_SECRET = 'CHESHMAK_SECRET_2025';
    
    function generateActivationCode(deviceId, years) {
      const raw = deviceId + LICENSE_SECRET + years;
      let hash = 0;
      for (let i = 0; i < raw.length; i++) {
        const char = raw.charCodeAt(i);
        hash = ((hash << 5) - hash) + char;
        hash = hash & hash;
      }
      const code = Math.abs(hash).toString(36).toUpperCase().padStart(8, '0');
      const part1 = code.substring(0, 4);
      const part2 = code.substring(4, 8);
      return `CHK-${part1}-${part2}-${years}`;
    }
    
    function generateCode() {
      const deviceId = document.getElementById('device-id').value.trim().toUpperCase();
      const years = parseInt(document.getElementById('years').value);
      
      if (!deviceId) {
        alert('Device ID را وارد کنید');
        return;
      }
      
      if (!deviceId.startsWith('DEV-')) {
        alert('Device ID باید با DEV- شروع بشه');
        return;
      }
      
      const code = generateActivationCode(deviceId, years);
      document.getElementById('code-output').textContent = code;
      document.getElementById('result').classList.add('show');
    }
    
    function copyCode() {
      const code = document.getElementById('code-output').textContent;
      navigator.clipboard.writeText(code);
      alert('کد کپی شد ✅');
    }
  </script>
</body>
</html>
