<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ابزار تولید لایسنس چشمک</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #15161F; color: #fff; padding: 20px; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: #1F2130; padding: 30px; border-radius: 15px; width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        input, select, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #333; background: #2a2c3a; color: #fff; box-sizing: border-box; font-family: inherit; font-size: 14px; }
        button { background: #14B8A6; border: none; cursor: pointer; font-weight: bold; margin-top: 15px; }
        button:hover { background: #0D9488; }
        .result { background: #14B8A6; color: #fff; text-align: center; padding: 15px; border-radius: 8px; margin-top: 15px; font-size: 18px; font-weight: bold; letter-spacing: 1px; display: none; }
    </style>
</head>
<body>
    <div class="box">
        <h2 style="text-align:center; margin-top:0;">🔑 تولید کد فعال‌سازی</h2>
        
        <label>شناسه دستگاه (Device ID):</label>
        <input type="text" id="deviceId" placeholder="DEV-XXXX-XXXX">
        
        <label>نوع تمدید:</label>
        <select id="type" onchange="toggleType()">
            <option value="days">بر اساس روز</option>
            <option value="years">بر اساس سال</option>
        </select>

        <div id="daysDiv">
            <label>تعداد روز:</label>
            <input type="number" id="days" value="2" min="1">
        </div>

        <div id="yearsDiv" style="display:none;">
            <label>تعداد سال:</label>
            <input type="number" id="years" value="1" min="1">
        </div>

        <button onclick="generate()">تولید کد</button>
        
        <div id="result" class="result"></div>
    </div>

    <script>
        const LICENSE_SECRET = 'CHESHMAK_SECRET_2025';

        function toggleType() {
            const type = document.getElementById('type').value;
            document.getElementById('daysDiv').style.display = type === 'days' ? 'block' : 'none';
            document.getElementById('yearsDiv').style.display = type === 'years' ? 'block' : 'none';
        }

        function generate() {
            const deviceId = document.getElementById('deviceId').value.trim();
            const type = document.getElementById('type').value;
            let amount = type === 'days' ? document.getElementById('days').value : document.getElementById('years').value;
            
            if (!deviceId || !amount) {
                alert('لطفاً همه فیلدها را پر کنید');
                return;
            }

            // 🔥 ساخت کد بر اساس روز یا سال (D برای روز، Y برای سال)
            const suffix = type === 'days' ? 'D' + amount : 'Y' + amount;
            const raw = deviceId + LICENSE_SECRET + suffix;
            
            let hash = 0;
            for (let i = 0; i < raw.length; i++) {
                const char = raw.charCodeAt(i);
                hash = ((hash << 5) - hash) + char;
                hash = hash & hash;
            }
            
            const code = Math.abs(hash).toString(36).toUpperCase().padStart(8, '0');
            const part1 = code.substring(0, 4);
            const part2 = code.substring(4, 8);
            
            // خروجی: CHK-XXXX-XXXX-D2 (برای ۲ روز) یا CHK-XXXX-XXXX-Y1 (برای ۱ سال)
            const finalCode = `CHK-${part1}-${part2}-${suffix}`;
            
            const resultBox = document.getElementById('result');
            resultBox.style.display = 'block';
            resultBox.innerText = finalCode;
            resultBox.onclick = () => {
                navigator.clipboard.writeText(finalCode);
                alert('کد کپی شد!');
            };
        }
    </script>
</body>
</html>
